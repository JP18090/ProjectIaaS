services:
  db:
    image: postgres:16-alpine
    container_name: projectiaas-db
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${DB_NAME:-projetodb}
      POSTGRES_USER: ${DB_USERNAME:-dbuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dbuser} -d ${DB_NAME:-projetodb}"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend
    container_name: projectiaas-backend
    profiles: ["backend", "full"]
    environment:
      SERVER_PORT: ${SERVER_PORT:-3000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-projetodb}
      DB_USERNAME: ${DB_USERNAME:-dbuser}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      FIPE_API_TOKEN: ${FIPE_API_TOKEN:-}
      FIPE_BASE_URL: https://fipe.parallelum.com.br/api/v2
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: projectiaas-frontend
    profiles: ["frontend", "full"]
    environment:
      PORT: ${FRONTEND_PORT:-80}
      API_BASE_URL: ${API_BASE_URL:-/api}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3000}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

volumes:
  pgdata:
